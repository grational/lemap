plugins {
	id 'groovy'
	id 'java-library'
	id 'maven-publish'
	id 'pl.allegro.tech.build.axion-release' version '1.21.1'
}

def targetJava = 17
def groovyVersion = '5.0.4'
def spockVersion = '2.4-groovy-5.0'

group = 'com.github.grational'
version = scmVersion.version

java {
	toolchain.languageVersion = JavaLanguageVersion.of(targetJava)
}

repositories {
	mavenCentral()
}

dependencies {
	def groovyGroup = groovyVersion.startsWith('3.') ? 'org.codehaus.groovy' : 'org.apache.groovy'
	api "${groovyGroup}:groovy:${groovyVersion}"
	implementation 'org.apache.commons:commons-text:1.9'
	implementation 'org.slf4j:slf4j-api:1.7.36'

	testImplementation "org.spockframework:spock-core:$spockVersion"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

[uniTest: 'USpec', intTest: 'ISpec', funTest: 'FSpec'].each { name, suffix ->
	tasks.register(name, Test) {
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		include "**/*${suffix}.class"
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) { from components.java }
	}
}
